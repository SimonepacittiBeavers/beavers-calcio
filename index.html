<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beavers Calcio — Area Allenatori</title>
  <link rel="icon" href="logo.jpeg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="logo.jpeg" class="login-logo" alt="Beavers Calcio">
      <h1>Beavers Calcio</h1>
      <p>Area Allenatori</p>
      <button id="loginBtn" class="btn btn-primary">Accedi</button>
      <button id="demoBtn" class="btn btn-secondary">Entra in modalità demo</button>
      <small id="loginHint">La modalità cloud richiede la configurazione Firebase indicata nel README.</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.jpeg" alt="Beavers">
        <div><strong>BEAVERS</strong><span>CALCIO</span></div>
      </div>
      <nav>
        <button data-view="dashboard" class="nav-btn active">⌂ <span>Dashboard</span></button>
        <button data-view="teams" class="nav-btn">👥 <span>Le mie squadre</span></button>
        <button data-view="calendar" class="nav-btn">▣ <span>Calendario</span></button>
        <button data-view="trainings" class="nav-btn">🏃 <span>Allenamenti</span></button>
                <button data-view="players" class="nav-btn">● <span>Giocatori</span></button>
        <button data-view="evaluations" class="nav-btn">★ <span>Valutazioni</span></button>
        <button data-view="stats" class="nav-btn">▥ <span>Statistiche</span></button>
        <button data-view="notes" class="nav-btn">▤ <span>Note</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button id="importBtn" class="nav-btn">⇧ <span>Importa Excel</span></button>
        <button id="exportBtn" class="nav-btn">⇩ <span>Esporta dati</span></button>
        <button id="settingsBtn" class="nav-btn">⚙ <span>Impostazioni</span></button>
        <button id="logoutBtn" class="nav-btn">↪ <span>Esci</span></button>
      </div>
      <input id="excelInput" type="file" accept=".xlsx,.xls" multiple hidden>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button id="mobileMenu" class="hamburger">☰</button>
          <h2 id="pageTitle">Benvenuto, Mister!</h2>
          <p id="pageSubtitle">Area allenatori Beavers Calcio</p>
        </div>
        <div class="user-box">
          <span id="modeBadge">DEMO</span>
          <span id="userName">Mister</span>
          <img src="logo.jpeg" alt="">
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
